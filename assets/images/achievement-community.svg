<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="achCmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b1a" />
      <stop offset="100%" stop-color="#0e2142" />
    </linearGradient>
    <linearGradient id="commGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>
    <filter id="cmGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#achCmBg)" stroke="rgba(255,215,0,0.3)" stroke-width="1.5" />
  
  <g opacity="0.1" stroke="#00c8ff" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <circle cx="300" cy="155" r="100" fill="#ffd700" opacity="0.1" filter="url(#cmGlow)" />

  <!-- People / Network Community Icon -->
  <g transform="translate(300, 150)">
    <!-- Central Leader -->
    <circle cx="0" cy="-25" r="16" fill="#ffd700" />
    <path d="M-22,18 C-22,-5 22,-5 22,18 Z" fill="url(#commGold)" />
    <!-- Left Peer -->
    <circle cx="-42" cy="-12" r="12" fill="#00c8ff" opacity="0.8" />
    <path d="M-58,25 C-58,5 -26,5 -26,25 Z" fill="#00c8ff" opacity="0.7" />
    <!-- Right Peer -->
    <circle cx="42" cy="-12" r="12" fill="#00c8ff" opacity="0.8" />
    <path d="M26,25 C26,5 58,5 58,25 Z" fill="#00c8ff" opacity="0.7" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 260)">
    <rect x="-140" y="0" width="280" height="36" rx="8" fill="rgba(10,20,40,0.85)" stroke="url(#commGold)" stroke-width="1.2" />
    <text x="0" y="24" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="800" fill="#ffd700" text-anchor="middle" letter-spacing="1.5">STUDENT COMMUNITY BUILDING</text>
  </g>

  <!-- Year Tag -->
  <g transform="translate(480, 25)">
    <rect width="95" height="26" rx="13" fill="rgba(255,215,0,0.15)" stroke="rgba(255,215,0,0.4)" stroke-width="1" />
    <text x="47" y="17" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#ffd700" text-anchor="middle">CONTINUOUS</text>
  </g>

  <text x="40" y="340" font-family="'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Peer Empowerment</text>
  <text x="40" y="360" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Mentoring 200+ Students in Cloud, Git &amp; Web Development</text>
</svg>