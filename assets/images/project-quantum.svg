<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="qcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#10152a" />
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="qcGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#qcBg)" />
  
  <!-- Circuit & Lattice Grid -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="1">
    <path d="M0,75 H800 M0,150 H800 M0,225 H800 M0,300 H800 M0,375 H800" />
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450" />
    <!-- Diagonal Lattice lines -->
    <line x1="100" y1="0" x2="550" y2="450" stroke-dasharray="8 6" />
    <line x1="250" y1="0" x2="700" y2="450" stroke-dasharray="8 6" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="270" cy="220" r="140" fill="#a855f7" opacity="0.18" filter="url(#qcGlow)" />
  <circle cx="560" cy="220" r="140" fill="#06b6d4" opacity="0.16" filter="url(#qcGlow)" />

  <!-- Left: Quantum Shield & Key Exchange Lock -->
  <g transform="translate(140, 105)">
    <rect width="230" height="220" rx="16" fill="rgba(18, 22, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5" />
    
    <!-- Quantum Shield Graphic -->
    <g transform="translate(115, 80)">
      <polygon points="0,-48 42,-22 42,28 0,52 -42,28 -42,-22" fill="none" stroke="url(#cyberPurple)" stroke-width="2.5" filter="url(#qcGlow)" />
      <!-- Inner Padlock -->
      <rect x="-16" y="-8" width="32" height="26" rx="5" fill="url(#neonGreen)" />
      <path d="M-10,-8 V-18 A 10,10 0 0,1 10,-18 V-8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="0" cy="5" r="3" fill="#0f172a" />
    </g>

    <!-- Key Exchange Pills -->
    <g transform="translate(20, 160)">
      <rect width="190" height="38" rx="8" fill="rgba(147, 51, 234, 0.15)" stroke="rgba(147, 51, 234, 0.3)" />
      <text x="95" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">ML-KEM-768 (Kyber)</text>
      <text x="95" y="32" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="600" fill="#a855f7" text-anchor="middle">NIST Post-Quantum Standard</text>
    </g>
  </g>

  <!-- Right: Cryptographic Cipher Protocol Pipeline -->
  <g transform="translate(410, 95)">
    <rect width="280" height="235" rx="16" fill="rgba(17, 26, 48, 0.85)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.5" />
    <rect width="280" height="34" rx="16" fill="rgba(24, 38, 70, 0.9)" />
    <text x="140" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">SECURE CHANNEL PIPELINE</text>

    <!-- Cipher stages -->
    <g transform="translate(20, 52)">
      <!-- Step 1 -->
      <rect width="240" height="38" rx="6" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.25)" />
      <text x="15" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a5f3fc">1. Encapsulate &amp; Decapsulate</text>
      <text x="15" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">ML-KEM-768 Shared Secret Agreement</text>
      
      <!-- Step 2 -->
      <rect y="50" width="240" height="38" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.25)" />
      <text x="15" y="67" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#e9d5ff">2. HKDF-SHA256 Derivation</text>
      <text x="15" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Cryptographically Strong Ephemeral Keys</text>

      <!-- Step 3 -->
      <rect y="100" width="240" height="38" rx="6" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" />
      <text x="15" y="117" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">3. AES-256-GCM Encryption</text>
      <text x="15" y="130" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Authenticated Payload &amp; Integrity Check</text>
    </g>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(50, 45)">
    <rect width="240" height="28" rx="8" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
    <text x="120" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">POST-QUANTUM CRYPTOGRAPHY</text>
  </g>

  <!-- Bottom Details -->
  <text x="50" y="390" font-family="'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">Quantum-Safe Secure Communication</text>
  <text x="50" y="415" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">ML-KEM-768 • AES-256-GCM • HKDF-SHA256 • Project Preview Placeholder</text>
</svg>