<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certStBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018" />
      <stop offset="50%" stop-color="#0c1a27" />
      <stop offset="100%" stop-color="#060c14" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cStGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="560" rx="16" fill="url(#certStBg)" stroke="rgba(16,185,129,0.3)" stroke-width="2" />

  <rect x="25" y="25" width="750" height="510" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <rect x="35" y="35" width="730" height="490" rx="10" fill="none" stroke="url(#emeraldGrad)" stroke-width="1" stroke-dasharray="8 6" opacity="0.6" />

  <g stroke="url(#emeraldGrad)" stroke-width="2" fill="none">
    <path d="M45,70 L45,45 L70,45" />
    <path d="M755,70 L755,45 L730,45" />
    <path d="M45,490 L45,515 L70,515" />
    <path d="M755,490 L755,515 L730,515" />
  </g>

  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="38" fill="#13272f" stroke="url(#emeraldGrad)" stroke-width="2.5" filter="url(#cStGlow)" />
    <!-- Checkmark inside -->
    <path d="M-12,-2 L-4,8 L14,-10" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="28" font-family="'Segoe UI', Inter, sans-serif" font-size="8" font-weight="800" fill="#a7f3d0" letter-spacing="1">QA PASSED</text>
  </g>

  <text x="400" y="180" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="3">CERTIFICATE OF SPECIALIZATION</text>
  <text x="400" y="215" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Software Testing &amp; Automation</text>
  <text x="400" y="245" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">CONFERRED UPON</text>
  
  <text x="400" y="290" font-family="'Segoe UI', Inter, sans-serif" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">NANDHINI S</text>
  <line x1="250" y1="305" x2="550" y2="305" stroke="url(#emeraldGrad)" stroke-width="1.5" />

  <text x="400" y="340" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">For practical execution of test automation frameworks using Selenium WebDriver, Java, and TestNG.</text>
  
  <g transform="translate(190, 375)">
    <rect width="420" height="38" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="210" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">[ CERTIFICATE PLACEHOLDER - ATTACH YOUR VERIFIED PDF/LINK ]</text>
  </g>

  <g transform="translate(140, 470)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="80" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Testing Academy Placeholder</text>
    <text x="80" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Automation Track Certification</text>
  </g>

  <g transform="translate(500, 470)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="80" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Credential ID: QA-AUTO-XXXX</text>
    <text x="80" y="34" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Date: Configurable Placeholder</text>
  </g>
</svg>