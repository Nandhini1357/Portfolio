<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="galWsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c" />
      <stop offset="100%" stop-color="#141a35" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="wsGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#galWsBg)" />
  
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,100 H800 M0,200 H800 M0,300 H800 M0,400 H800" />
    <path d="M100,0 V500 M200,0 V500 M300,0 V500 M400,0 V500 M500,0 V500 M600,0 V500 M700,0 V500" />
  </g>

  <circle cx="400" cy="210" r="150" fill="#8b5cf6" opacity="0.15" filter="url(#wsGlow)" />
  <circle cx="200" cy="200" r="110" fill="#06b6d4" opacity="0.12" filter="url(#wsGlow)" />

  <!-- Code Editor Window Mockup -->
  <g transform="translate(130, 80)">
    <rect width="540" height="270" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />
    <!-- Window Bar -->
    <rect width="540" height="34" rx="16" fill="rgba(30, 41, 69, 0.95)" />
    <circle cx="24" cy="17" r="5" fill="#ef4444" />
    <circle cx="42" cy="17" r="5" fill="#f59e0b" />
    <circle cx="60" cy="17" r="5" fill="#10b981" />
    <text x="270" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">workshop-lab-hands-on.py — Terminal active</text>

    <!-- Code Lines -->
    <g transform="translate(30, 55)" font-family="'Consolas', 'Courier New', monospace" font-size="13">
      <text x="0" y="20" fill="#c084fc"># Hands-On Cloud &amp; Full Stack Workshop Session</text>
      <text x="0" y="45" fill="#60a5fa"><tspan fill="#f43f5e">def</tspan> <tspan fill="#38bdf8">build_scalable_microservice</tspan>(service_name, cluster):</text>
      <text x="30" y="70" fill="#e2e8f0">app = SpringApplication(config="cloud-aws-prod")</text>
      <text x="30" y="95" fill="#e2e8f0">app.enable_quantum_safe_layer(cipher="ML-KEM-768")</text>
      <text x="30" y="120" fill="#34d399">return {"status": "deployed", "region": "ap-south-1"}</text>
      <text x="0" y="150" fill="#f59e0b">&gt; Executing live student lab tests... [PASS 48/48]</text>
      <text x="0" y="175" fill="#10b981">&gt; 100% active participants connected via Git classroom.</text>
    </g>
  </g>

  <!-- Tag & Description -->
  <g transform="translate(40, 40)">
    <rect width="180" height="28" rx="8" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.4)" stroke-width="1" />
    <text x="90" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">TECHNICAL WORKSHOP</text>
  </g>

  <g transform="translate(40, 430)">
    <text x="0" y="20" font-family="'Segoe UI', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Hands-On Technical Coding &amp; Architecture Lab</text>
    <text x="0" y="42" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Interactive peer coding &amp; development workshop • Replace in assets/images/gallery-tech-workshop.jpg</text>
