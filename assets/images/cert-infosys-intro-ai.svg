<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG_cert-infosys-intro-ai.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbfe"/>
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="698" fill="url(#bgG_cert-infosys-intro-ai.svg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Logo: Infosys Navigate your next -->
  <g transform="translate(500, 70)" text-anchor="middle">
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-size="44" font-weight="600" fill="#007cc3" letter-spacing="-0.5">Infosys<tspan font-size="16" dy="-18">&#174;</tspan></text>
    <text y="22" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#4a5568" letter-spacing="1.2">Navigate your next</text>
  </g>

  <!-- Dashed lines & COURSE COMPLETION CERTIFICATE -->
  <g transform="translate(0, 185)">
    <line x1="45" y1="0" x2="210" y2="0" stroke="#007cc3" stroke-width="2.5" stroke-dasharray="3, 4" opacity="0.6"/>
    <text x="500" y="6" font-family="'Segoe UI', -apple-system, sans-serif" font-size="21" font-weight="700" fill="#007cc3" letter-spacing="3" text-anchor="middle">COURSE COMPLETION CERTIFICATE</text>
    <line x1="790" y1="0" x2="955" y2="0" stroke="#007cc3" stroke-width="2.5" stroke-dasharray="3, 4" opacity="0.6"/>
  </g>

  <!-- Award text -->
  <text x="500" y="235" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#4a5568" text-anchor="middle">The certificate is awarded to</text>

  <!-- Candidate Name: NANDHINI S -->
  <text x="500" y="274" font-family="'Segoe UI', -apple-system, sans-serif" font-size="32" font-weight="800" fill="#007cc3" letter-spacing="0.5" text-anchor="middle">NANDHINI S</text>

  <!-- Description text -->
  <text x="500" y="306" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#4a5568" text-anchor="middle">for successfully completing the course</text>

  <!-- Course Title -->
  
      <text x="500" y="338" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#007cc3" text-anchor="middle">Introduction to Artificial Intelligence</text>
    

  <!-- Completed date -->
  <text x="500" y="395" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#2d3748" text-anchor="middle">on July 5, 2025</text>

  <!-- Infosys Springboard Logo -->
  <g transform="translate(500, 460)" text-anchor="middle">
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#007cc3">Infosys <tspan fill="#a0aec0" font-weight="300">|</tspan> <tspan fill="#f37021">Springb</tspan><tspan fill="#007cc3">ö</tspan><tspan fill="#f37021">ard</tspan></text>
    <text y="32" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="20" font-style="italic" fill="#e53e3e">Congratulations! You make us proud!</text>
  </g>

  <!-- Left: Authentic QR Code & Verification -->
  <g transform="translate(50, 520)">
    <image xlink:href="data:image/png;base64," href="data:image/png;base64," x="0" y="0" width="85" height="85" preserveAspectRatio="none"/>
    <text x="0" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4a5568">Issued on: Sunday, July 6, 2025</text>
    <text x="0" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#718096">To verify, scan the QR code at <tspan fill="#007cc3" text-decoration="underline">https://verify.onwingspan.com</tspan></text>
  </g>

  <!-- Right: Signatory & Title -->
  <g transform="translate(950, 560)" text-anchor="end">
    <path d="M0,18 C20,-2 40,24 60,10 C80,-5 100,28 120,8 C135,-3 145,22 160,15" fill="none" stroke="#1d3557" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1a202c">Thirumala Arohi</text>
    <text y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4a5568">Executive Vice President and Global Head</text>
    <text y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4a5568">Education, Training & Assessment (ETA)</text>
    <text y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2d3748">Infosys Limited</text>
  </g>
</svg>