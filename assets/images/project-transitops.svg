<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="toBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#050a17" />
    </linearGradient>

    <!-- Cyan to Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald / Live Gradient -->
    <linearGradient id="liveEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Chart Area Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="toGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#toBg)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#00c8ff" stroke-width="1">
    <path d="M0,50 H800 M0,100 H800 M0,150 H800 M0,200 H800 M0,250 H800 M0,300 H800 M0,350 H800 M0,400 H800" />
    <path d="M50,0 V450 M100,0 V450 M150,0 V450 M200,0 V450 M250,0 V450 M300,0 V450 M350,0 V450 M400,0 V450 M450,0 V450 M500,0 V450 M550,0 V450 M600,0 V450 M650,0 V450 M700,0 V450 M750,0 V450" />
  </g>

  <!-- Ambient Glow Spots -->
  <circle cx="180" cy="140" r="130" fill="#00c8ff" opacity="0.14" filter="url(#toGlow)" />
  <circle cx="640" cy="280" r="150" fill="#6366f1" opacity="0.12" filter="url(#toGlow)" />

  <!-- Main Application Window Card -->
  <g transform="translate(40, 24)">
    
    <!-- Outer Window Frame -->
    <rect width="720" height="402" rx="14" fill="#070d1e" stroke="rgba(0, 200, 255, 0.28)" stroke-width="1.5" />
    
    <!-- Window Top Header Bar -->
    <rect width="720" height="42" rx="14" fill="#0c142c" />
    <rect y="32" width="720" height="10" fill="#0c142c" />
    <line x1="0" y1="42" x2="720" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="22" cy="21" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="54" cy="21" r="5" fill="#10b981" opacity="0.85" />

    <!-- Application Brand / Title in Header -->
    <g transform="translate(80, 12)">
      <!-- Bus Mini Icon -->
      <rect x="0" y="2" width="16" height="14" rx="3" fill="url(#cyanBlueGrad)" />
      <circle cx="4" cy="15" r="1.8" fill="#070d1e" />
      <circle cx="12" cy="15" r="1.8" fill="#070d1e" />
      <rect x="3" y="4" width="10" height="5" rx="1" fill="#ffffff" opacity="0.9" />
      <text x="24" y="14" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.8">TRANSITOPS</text>
      <text x="108" y="14" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748b">| Centralized Transit Operations Management</text>
    </g>

    <!-- Live Status Pill in Header -->
    <g transform="translate(605, 11)">
      <rect width="95" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <circle cx="12" cy="10" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="14" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.5">LIVE DISPATCH</text>
    </g>

    <!-- Top Metrics Row (3 Mini Cards) -->
    <g transform="translate(20, 56)">
      <!-- Metric 1: Fleet Active -->
      <g transform="translate(0, 0)">
        <rect width="215" height="52" rx="8" fill="rgba(13, 22, 46, 0.75)" stroke="rgba(0, 200, 255, 0.2)" stroke-width="1" />
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ACTIVE FLEET UNITS</text>
        <text x="14" y="42" font-family="'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">48 <tspan font-size="11" font-weight="600" fill="#38bdf8">Buses Online</tspan></text>
        <circle cx="195" cy="26" r="10" fill="rgba(0, 200, 255, 0.12)" />
        <text x="195" y="30" font-size="11" text-anchor="middle">🚌</text>
      </g>

      <!-- Metric 2: On-Time Rate -->
      <g transform="translate(232, 0)">
        <rect width="215" height="52" rx="8" fill="rgba(13, 22, 46, 0.75)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">SYSTEM ON-TIME RATE</text>
        <text x="14" y="42" font-family="'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#34d399">98.4% <tspan font-size="10" font-weight="600" fill="#10b981">Optimal</tspan></text>
        <circle cx="195" cy="26" r="10" fill="rgba(16, 185, 129, 0.12)" />
        <text x="195" y="30" font-size="11" text-anchor="middle">⏱️</text>
      </g>

      <!-- Metric 3: API & Security Status -->
      <g transform="translate(465, 0)">
        <rect width="215" height="52" rx="8" fill="rgba(13, 22, 46, 0.75)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1" />
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">REST API / JWT AUTH</text>
        <text x="14" y="42" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#c084fc">Spring Boot 3 <tspan font-size="10" font-weight="600" fill="#a855f7">• 24ms</tspan></text>
        <circle cx="195" cy="26" r="10" fill="rgba(139, 92, 246, 0.15)" />
        <text x="195" y="30" font-size="11" text-anchor="middle">🔒</text>
      </g>
    </g>

    <!-- Main Content Area: Left (Route Map & Live Tracking) + Right (Telemetry & Analytics) -->
    
    <!-- LEFT PANEL: Interactive Transit Route Map -->
    <g transform="translate(20, 120)">
      <rect width="395" height="232" rx="10" fill="rgba(9, 16, 35, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      
      <!-- Panel Header -->
      <text x="16" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">LIVE TRANSIT ROUTE MAP</text>
      <text x="375" y="22" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#00c8ff" text-anchor="end">GPS 42.10°N // 76.54°E</text>
      <line x1="16" y1="30" x2="379" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

      <!-- Map Canvas Background Grid -->
      <g opacity="0.15" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 3">
        <line x1="20" y1="80" x2="375" y2="80" />
        <line x1="20" y1="130" x2="375" y2="130" />
        <line x1="20" y1="180" x2="375" y2="180" />
        <line x1="100" y1="35" x2="100" y2="220" />
        <line x1="200" y1="35" x2="200" y2="220" />
        <line x1="300" y1="35" x2="300" y2="220" />
      </g>

      <!-- Route 01 (Neon Cyan Path) -->
      <path d="M 40,195 Q 110,160 170,165 T 270,100 T 360,70" fill="none" stroke="#00c8ff" stroke-width="3.5" stroke-linecap="round" filter="url(#toGlow)" opacity="0.6" />
      <path d="M 40,195 Q 110,160 170,165 T 270,100 T 360,70" fill="none" stroke="#00c8ff" stroke-width="2.5" stroke-linecap="round" />

      <!-- Route 02 (Neon Purple Secondary Path) -->
      <path d="M 50,75 Q 140,110 200,105 T 320,185 T 365,200" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.75" />

      <!-- Transit Stations / Stops -->
      <!-- Station 1 -->
      <circle cx="40" cy="195" r="5" fill="#070d1e" stroke="#00c8ff" stroke-width="2" />
      <text x="35" y="215" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8">Central Hub</text>

      <!-- Station 2 -->
      <circle cx="170" cy="165" r="4.5" fill="#070d1e" stroke="#00c8ff" stroke-width="2" />
      <text x="170" y="152" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Tech Park</text>

      <!-- Station 3 -->
      <circle cx="270" cy="100" r="4.5" fill="#070d1e" stroke="#00c8ff" stroke-width="2" />
      <text x="270" y="87" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="middle">SKCT Campus</text>

      <!-- Station 4 -->
      <circle cx="360" cy="70" r="5" fill="#070d1e" stroke="#00c8ff" stroke-width="2" />
      <text x="355" y="58" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" text-anchor="end">Airport Terminal</text>

      <!-- Live Bus Vehicle Marker (Pulse Ring) -->
      <circle cx="220" cy="128" r="14" fill="#00c8ff" opacity="0.25">
        <animate attributeName="r" values="8;18;8" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="220" cy="128" r="7" fill="#00c8ff" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Bus Live Callout Tag -->
      <g transform="translate(195, 90)">
        <rect width="105" height="28" rx="6" fill="rgba(10, 19, 44, 0.95)" stroke="#00c8ff" stroke-width="1" />
        <text x="8" y="13" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff">BUS #TO-104</text>
        <text x="8" y="23" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="500" fill="#38bdf8">Speed: 42 km/h • On-Time</text>
      </g>
    </g>

    <!-- RIGHT PANEL: Telemetry, Recharts Analytics & Architecture Badges -->
    <g transform="translate(430, 120)">
      <rect width="270" height="232" rx="10" fill="rgba(9, 16, 35, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      
      <!-- Panel Header -->
      <text x="14" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">PASSENGER LOAD &amp; TELEMETRY</text>
      <line x1="14" y1="30" x2="256" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

      <!-- Recharts Analytics Wave Chart Mockup -->
      <g transform="translate(14, 38)">
        <text x="0" y="10" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Real-time Occupancy Flow (Recharts)</text>
        <!-- Area chart background -->
        <path d="M 0,60 L 30,48 L 65,52 L 100,32 L 140,40 L 175,20 L 210,26 L 242,12 L 242,70 L 0,70 Z" fill="url(#chartGrad)" />
        <path d="M 0,60 L 30,48 L 65,52 L 100,32 L 140,40 L 175,20 L 210,26 L 242,12" fill="none" stroke="#00c8ff" stroke-width="2" />
        <circle cx="242" cy="12" r="3" fill="#00c8ff" stroke="#ffffff" stroke-width="1" />
      </g>

      <!-- Live Bus Telemetry Card -->
      <g transform="translate(14, 118)">
        <rect width="242" height="48" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
        <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0">Route 07: SKCT Campus Express</text>
        <text x="10" y="32" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="500" fill="#94a3b8">Occupancy: 68% • Next: Tech Park Terminal</text>
        <rect x="175" y="12" width="58" height="24" rx="4" fill="rgba(0, 200, 255, 0.12)" />
        <text x="204" y="27" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="700" fill="#00c8ff" text-anchor="middle">ETA 3 MIN</text>
      </g>

      <!-- Tech Stack Mini Badges Row -->
      <g transform="translate(14, 178)">
        <text x="0" y="10" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="0.5">FULL-STACK TECH STACK:</text>
        
        <g transform="translate(0, 16)">
          <rect width="52" height="18" rx="4" fill="rgba(0, 200, 255, 0.1)" stroke="rgba(0, 200, 255, 0.3)" stroke-width="0.8" />
          <text x="26" y="12" font-family="'Fira Code', monospace" font-size="7.5" font-weight="600" fill="#00c8ff" text-anchor="middle">Spring 3</text>

          <rect x="58" width="54" height="18" rx="4" fill="rgba(0, 200, 255, 0.1)" stroke="rgba(0, 200, 255, 0.3)" stroke-width="0.8" />
          <text x="85" y="12" font-family="'Fira Code', monospace" font-size="7.5" font-weight="600" fill="#00c8ff" text-anchor="middle">React 18</text>

          <rect x="118" width="50" height="18" rx="4" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="0.8" />
          <text x="143" y="12" font-family="'Fira Code', monospace" font-size="7.5" font-weight="600" fill="#c084fc" text-anchor="middle">MySQL 8</text>

          <rect x="174" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="0.8" />
          <text x="208" y="12" font-family="'Fira Code', monospace" font-size="7.5" font-weight="600" fill="#34d399" text-anchor="middle">JWT Security</text>
        </g>
      </g>
    </g>

    <!-- Bottom Notification Bar -->
    <g transform="translate(20, 362)">
      <rect width="680" height="26" rx="6" fill="rgba(6, 12, 28, 0.85)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="12" y="17" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">🚌 TransitOps Hackathon Build • Centralized Transit Operations Platform with Real-Time Telematics &amp; Dispatch</text>
      <text x="668" y="17" font-family="'Fira Code', monospace" font-size="8.5" font-weight="600" fill="#00c8ff" text-anchor="end">v1.0-STABLE</text>
    </g>

  </g>
</svg>
