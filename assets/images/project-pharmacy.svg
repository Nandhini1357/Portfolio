<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#0e1a2f" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="jwtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="phGlow">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#phBg)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0,75 H800 M0,150 H800 M0,225 H800 M0,300 H800 M0,375 H800" />
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450" />
  </g>

  <!-- Glowing nodes -->
  <circle cx="250" cy="220" r="130" fill="#14b8a6" opacity="0.14" filter="url(#phGlow)" />
  <circle cx="560" cy="220" r="140" fill="#6366f1" opacity="0.16" filter="url(#phGlow)" />

  <!-- Left: Medical Prescription & Pill Icon -->
  <g transform="translate(150, 105)">
    <rect width="210" height="215" rx="16" fill="rgba(15, 28, 45, 0.85)" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5" />
    
    <!-- Pharmacy Cross & Capsule -->
    <g transform="translate(105, 75)">
      <!-- Cross background ring -->
      <circle cx="0" cy="0" r="46" fill="rgba(20, 184, 166, 0.15)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="2" />
      <rect x="-10" y="-30" width="20" height="60" rx="6" fill="url(#tealGrad)" />
      <rect x="-30" y="-10" width="60" height="20" rx="6" fill="url(#tealGrad)" />
    </g>

    <!-- Pill Capsule badge -->
    <g transform="translate(45, 145)">
      <rect width="120" height="40" rx="20" fill="rgba(14, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <path d="M 20,20 L 50,20" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
      <path d="M 50,20 L 70,20" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
      <text x="80" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Rx System</text>
    </g>
  </g>

  <!-- Right: Spring Boot + JWT RBAC Security Dashboard -->
  <g transform="translate(400, 95)">
    <rect width="290" height="235" rx="16" fill="rgba(18, 27, 48, 0.85)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" />
    <rect width="290" height="34" rx="16" fill="rgba(24, 38, 68, 0.9)" />
    <text x="145" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">ROLE-BASED ACCESS CONTROL</text>

    <!-- Role badges -->
    <g transform="translate(20, 52)">
      <rect width="75" height="24" rx="6" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" />
      <text x="37" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#c7d2fe" text-anchor="middle">Admin</text>

      <rect x="85" y="0" width="80" height="24" rx="6" fill="rgba(20,184,166,0.2)" stroke="rgba(20,184,166,0.4)" />
      <text x="125" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#5eead4" text-anchor="middle">Pharmacist</text>

      <rect x="175" y="0" width="75" height="24" rx="6" fill="rgba(236,72,153,0.2)" stroke="rgba(236,72,153,0.4)" />
      <text x="212" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">Doctor</text>
    </g>

    <!-- Real-time module bars -->
    <g transform="translate(20, 95)">
      <text x="0" y="12" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">Prescription Verification</text>
      <rect x="0" y="20" width="250" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="20" width="220" height="6" rx="3" fill="url(#tealGrad)" />

      <text x="0" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">Batch Inventory &amp; Expiry Tracker</text>
      <rect x="0" y="58" width="250" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="58" width="180" height="6" rx="3" fill="url(#jwtGrad)" />

      <text x="0" y="88" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">JWT Authenticated REST Endpoints</text>
      <rect x="0" y="96" width="250" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="96" width="240" height="6" rx="3" fill="#3b82f6" />
    </g>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(50, 45)">
    <rect width="210" height="28" rx="8" fill="rgba(20,184,166,0.15)" stroke="rgba(20,184,166,0.3)" stroke-width="1" />
    <text x="105" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#5eead4" text-anchor="middle">FULL STACK HEALTHCARE APP</text>
  </g>

  <!-- Bottom Details -->
  <text x="50" y="390" font-family="'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">Hospital Pharmacy Management System</text>
  <text x="50" y="415" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Inventory, Prescription &amp; Role-Based Access Control • Project Preview Placeholder</text>
</svg>