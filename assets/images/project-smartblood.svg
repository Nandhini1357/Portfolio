<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="sbGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sbBg)" />
  
  <!-- Grid backdrop -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0,75 H800 M0,150 H800 M0,225 H800 M0,300 H800 M0,375 H800" />
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450" />
  </g>

  <!-- Glowing accents -->
  <circle cx="240" cy="225" r="130" fill="#ef4444" opacity="0.12" filter="url(#sbGlow)" />
  <circle cx="560" cy="225" r="140" fill="#8b5cf6" opacity="0.14" filter="url(#sbGlow)" />

  <!-- Left: Medical Drop & Decision System Icon -->
  <g transform="translate(160, 110)">
    <!-- Shield/Plate -->
    <rect x="-80" y="0" width="160" height="210" rx="20" fill="rgba(25, 18, 32, 0.7)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5" />
    
    <!-- Blood Drop Shape -->
    <path d="M0,45 C20,75, 45,100, 45,130 C45,160, 25,180, 0,180 C-25,180, -45,160, -45,130 C-45,100, -20,75, 0,45 Z" fill="url(#redGrad)" filter="url(#sbGlow)" opacity="0.9" />
    
    <!-- Inner Cross -->
    <path d="M-6,115 H6 V145 H-6 Z M-18,127 H18 V133 H-18 Z" fill="#ffffff" />
    <text x="0" y="200" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">SMART DSS</text>
  </g>

  <!-- Pulse EKG Line connecting -->
  <path d="M260,215 L320,215 L335,175 L355,255 L375,190 L390,230 L405,215 L460,215" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Right: Dashboard & Decision Tree Card -->
  <g transform="translate(450, 95)">
    <rect width="270" height="235" rx="16" fill="rgba(20,28,48,0.85)" stroke="rgba(139,92,246,0.25)" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="270" height="34" rx="16" fill="rgba(30,41,69,0.9)" />
    <circle cx="20" cy="17" r="4" fill="#ef4444" />
    <circle cx="35" cy="17" r="4" fill="#f59e0b" />
    <circle cx="50" cy="17" r="4" fill="#10b981" />
    <text x="140" y="22" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Blood Bank Inventory AI</text>

    <!-- Mini Analytics Bars -->
    <text x="25" y="65" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">A+ / B+ Critical Forecast</text>
    <rect x="25" y="75" width="220" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="75" width="175" height="8" rx="4" fill="url(#redGrad)" />

    <text x="25" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">O- Emergency Reserve</text>
    <rect x="25" y="120" width="220" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="120" width="95" height="8" rx="4" fill="#3b82f6" />

    <text x="25" y="155" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" font-weight="600">Hospital Demand Prediction</text>
    <rect x="25" y="165" width="220" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="165" width="200" height="8" rx="4" fill="url(#purpleGrad)" />

    <g transform="translate(25, 190)">
      <rect width="220" height="26" rx="6" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1" />
      <text x="110" y="17" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle">STATUS: OPTIMAL ALLOCATION</text>
    </g>
  </g>

  <!-- Top Title Tag -->
  <g transform="translate(50, 45)">
    <rect width="180" height="28" rx="8" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.3)" stroke-width="1" />
    <text x="90" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">DECISION SUPPORT SYSTEM</text>
  </g>

  <!-- Bottom Title & Note -->
  <text x="50" y="390" font-family="'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">SmartBlood DSS</text>
  <text x="50" y="415" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Smart Blood Management &amp; Decision Support System • Project Preview Placeholder</text>
</svg>