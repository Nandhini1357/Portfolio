<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="galColBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1126" />
      <stop offset="100%" stop-color="#151e3f" />
    </linearGradient>
    <linearGradient id="skctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="colGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#galColBg)" />
  
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,100 H800 M0,200 H800 M0,300 H800 M0,400 H800" />
    <path d="M100,0 V500 M200,0 V500 M300,0 V500 M400,0 V500 M500,0 V500 M600,0 V500 M700,0 V500" />
  </g>

  <circle cx="280" cy="220" r="140" fill="#8b5cf6" opacity="0.16" filter="url(#colGlow)" />
  <circle cx="530" cy="220" r="140" fill="#ec4899" opacity="0.14" filter="url(#colGlow)" />

  <!-- College Campus / Tech Community Hub Graphics -->
  <g transform="translate(160, 90)">
    <rect width="480" height="260" rx="16" fill="rgba(20, 27, 52, 0.85)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />
    
    <!-- Community Hub Badge -->
    <g transform="translate(240, 75)">
      <circle cx="0" cy="0" r="46" fill="rgba(139,92,246,0.15)" stroke="url(#skctGrad)" stroke-width="2.5" />
      <path d="M-20,-10 C-20,-22 20,-22 20,-10 C20,10 -20,10 -20,-10 Z" fill="none" stroke="#ffffff" stroke-width="2" />
      <!-- Graduation cap / college pillar icon -->
      <polygon points="0,-24 28,-10 0,4 -28,-10" fill="#a78bfa" />
      <line x1="28" y1="-10" x2="28" y2="8" stroke="#f472b6" stroke-width="2" />
      <circle cx="28" cy="8" r="3" fill="#f472b6" />
      <path d="M-18,-4 V12 Q0,24 18,12 V-4" fill="none" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Community Network Nodes -->
    <g transform="translate(60, 150)">
      <circle cx="40" cy="30" r="18" fill="rgba(59,130,246,0.2)" stroke="#60a5fa" stroke-width="1.5" />
      <text x="40" y="34" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">SKCT</text>

      <circle cx="180" cy="30" r="24" fill="rgba(139,92,246,0.2)" stroke="#a78bfa" stroke-width="1.5" />
      <text x="180" y="34" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AWS SBG</text>

      <circle cx="320" cy="30" r="18" fill="rgba(236,72,153,0.2)" stroke="#f472b6" stroke-width="1.5" />
      <text x="320" y="34" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">LEAD</text>

      <!-- Connecting dotted lines -->
      <line x1="58" y1="30" x2="156" y2="30" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="204" y1="30" x2="302" y2="30" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 4" />
    </g>

    <text x="240" y="230" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Sri Krishna College of Technology • Student Community Building</text>
  </g>

  <!-- Tag & Description -->
  <g transform="translate(40, 40)">
    <rect width="170" height="28" rx="8" fill="rgba(236,72,153,0.18)" stroke="rgba(236,72,153,0.4)" stroke-width="1" />
    <text x="85" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#fbcfe8" text-anchor="middle">COLLEGE ACTIVITIES</text>
  </g>

  <g transform="translate(40, 430)">
    <text x="0" y="20" font-family="'Segoe UI', Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff">SKCT Campus Activities &amp; Student Mentorship</text>
    <text x="0" y="42" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Active engagement in tech clubs, peer guidance &amp; student symposiums • Replace in assets/images/gallery-college-activity.jpg</text>
  </g>
</svg>